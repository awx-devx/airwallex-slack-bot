# Slack app manifest for the Airwallex invoicing bot.
#
# api.slack.com/apps -> Create New App -> From an app manifest -> paste this.
#
# Then collect three values:
#   Basic Information -> App-Level Tokens -> create one with connections:write
#                                            -> SLACK_APP_TOKEN  (xapp-...)
#   Basic Information -> Signing Secret     -> SLACK_SIGNING_SECRET
#   OAuth & Permissions -> Install to workspace
#                       -> Bot User OAuth Token -> SLACK_BOT_TOKEN (xoxb-...)
#
# Finally: /invite @Invoice Bot in the channel you will use.

display_information:
  name: Airwallex Invoice Bot
features:
  bot_user:
    display_name: Invoice Bot
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
